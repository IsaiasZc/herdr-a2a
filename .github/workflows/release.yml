name: Release

on:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      - name: Install Herdr
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -c "irm https://herdr.dev/install.ps1 | iex"

      - name: Expose Herdr to this job
        shell: pwsh
        run: |
          $herdrBin = Join-Path $env:LOCALAPPDATA "Programs\Herdr\bin"
          $herdrExe = Join-Path $herdrBin "herdr.exe"
          if (-not (Test-Path -LiteralPath $herdrExe -PathType Leaf)) { throw "Herdr was not installed at $herdrExe" }
          "HERDR_BIN_PATH=$herdrExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $herdrBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $herdrExe --version

      - name: Verify foreign skill links are preserved
        shell: pwsh
        run: |
          $skillDir = Join-Path $HOME ".codex\skills"
          $foreignTarget = Join-Path $env:RUNNER_TEMP "foreign-herdr-a2a-skill"
          $link = Join-Path $skillDir "herdr-a2a"
          New-Item -ItemType Directory -Path $skillDir -Force | Out-Null
          New-Item -ItemType Directory -Path $foreignTarget -Force | Out-Null
          if (Test-Path -LiteralPath $link) { Remove-Item -LiteralPath $link -Force }
          New-Item -ItemType Junction -Path $link -Target $foreignTarget | Out-Null

          ./scripts/install.ps1
          ./scripts/install.ps1 uninstall

          $item = Get-Item -LiteralPath $link -Force
          $actual = [IO.Path]::GetFullPath([string]($item.Target | Select-Object -First 1))
          $expected = [IO.Path]::GetFullPath($foreignTarget)
          if ($actual -ne $expected) { throw "installer replaced or removed a foreign skill junction" }

          Remove-Item -LiteralPath $link -Force
          Remove-Item -LiteralPath $foreignTarget -Recurse -Force

      - name: Exercise the installer lifecycle
        shell: pwsh
        run: |
          ./scripts/install.ps1
          ./scripts/install.ps1 status
          $env:HERDR_ENV = "1"
          npm run test:integration
          ./scripts/install.ps1 uninstall

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: windows-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --title "${GITHUB_REF_NAME}"
