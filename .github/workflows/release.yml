name: Release

on:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - name: Install Herdr
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -c "irm https://herdr.dev/install.ps1 | iex"
      - name: Expose Herdr to this job
        shell: pwsh
        run: |
          $herdrBin = Join-Path $env:LOCALAPPDATA "Programs\Herdr\bin"
          $herdrExe = Join-Path $herdrBin "herdr.exe"
          if (-not (Test-Path -LiteralPath $herdrExe -PathType Leaf)) { throw "Herdr was not installed at $herdrExe" }
          "HERDR_BIN_PATH=$herdrExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $herdrBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $herdrExe --version
      - name: Exercise the installer lifecycle
        shell: pwsh
        run: |
          ./scripts/install.ps1
          ./scripts/install.ps1 status
          $env:HERDR_ENV = "1"
          npm run test:integration
          ./scripts/install.ps1 uninstall

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: windows-installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --title "${GITHUB_REF_NAME}"
